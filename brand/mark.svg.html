<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seal Gaming Utility - Brand Icon</title>
<style>
  :root {
    --bg-dark: #080b11;
    --card-bg: #0f1523;
    --card-border: #1e293b;
    --cyan: #00d2ff;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: radial-gradient(circle at 50% 20%, #111a2e 0%, #080b11 75%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    text-align: center;
    max-width: 600px;
    margin-bottom: 36px;
  }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(0, 210, 255, 0.12);
    border: 1px solid rgba(0, 210, 255, 0.35);
    border-radius: 999px;
    color: var(--cyan);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 10px 0;
    letter-spacing: 1px;
  }
  p.subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
    max-width: 900px;
    width: 100%;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 320px;
  }
  .preview-box {
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    margin-bottom: 20px;
  }
  .preview-box.dark {
    background: #06090e;
    border: 1px solid #1a2333;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }
  .preview-box.light {
    background: #ffffff;
    border: 1px solid #e2e8f0;
  }
  .preview-box img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
  }
  .card-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 6px 0;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="badge">Official Application Brand Mark</div>
  <h1>Seal Gaming Utility Mark</h1>
  <p class="subtitle">Embedded in Seal.exe, app.ico, system tray, and navigation rail.</p>
</header>

<div class="grid">
  <div class="card">
    <div class="preview-box dark">
      <img src="mark-512.png" alt="Seal Icon Dark">
    </div>
    <div class="card-title">Dark Theme / Taskbar</div>
    <div class="card-desc">Floating chrome silver on dark background with anti-aliasing.</div>
  </div>

  <div class="card">
    <div class="preview-box light">
      <img src="mark-512.png" alt="Seal Icon Light">
    </div>
    <div class="card-title">Light Theme / Desktop</div>
    <div class="card-desc">Contoured edge definition ensuring crisp visibility on white.</div>
  </div>
</div>

</body>
</html>
